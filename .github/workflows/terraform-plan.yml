name: Terraform Plan

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-south-1

jobs:
  plan-eks:
    name: Terraform Plan - EKS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev/eks

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Show Terraform Plan
        run: terraform show -no-color tfplan > plan.txt

      - name: Upload EKS Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-eks
          path: terraform/environments/dev/eks/plan.txt


  plan-platform:
    name: Terraform Plan - Platform
    runs-on: ubuntu-latest
    needs: plan-eks

    defaults:
      run:
        working-directory: terraform/environments/dev/platform

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Show Terraform Plan
        run: terraform show -no-color tfplan > plan.txt

      - name: Upload Platform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-platform
          path: terraform/environments/dev/platform/plan.txt


  plan-application:
    name: Terraform Plan - ApplicationSet
    runs-on: ubuntu-latest
    needs: plan-platform

    defaults:
      run:
        working-directory: terraform/environments/dev/application

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Show Terraform Plan
        run: terraform show -no-color tfplan > plan.txt

      - name: Upload Application Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-application
          path: terraform/environments/dev/application/plan.txt


  comment-plan:
    name: Post Plan to PR
    runs-on: ubuntu-latest
    needs:
      - plan-eks
      - plan-platform
      - plan-application

    steps:
      - name: Download EKS Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-eks
          path: plans/eks

      - name: Download Platform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-platform
          path: plans/platform

      - name: Download Application Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-application
          path: plans/application

      - name: Create PR comment
        run: |
          {
            echo "## Terraform Plan"
            echo
            echo "### EKS"
            echo '```terraform'
            cat plans/eks/plan.txt
            echo '```'
            echo
            echo "### Platform"
            echo '```terraform'
            cat plans/platform/plan.txt
            echo '```'
            echo
            echo "### ApplicationSet"
            echo '```terraform'
            cat plans/application/plan.txt
            echo '```'
          } > terraform-plan-comment.md

      - name: Comment Terraform Plan on PR
        uses: actions/github-script@v7
        env:
          PLAN_FILE: terraform-plan-comment.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");

            const body = fs.readFileSync(
              process.env.PLAN_FILE,
              "utf8"
            );

            const marker = "<!-- terraform-plan -->";

            const commentBody = `${marker}\n${body}`;

            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });

            const existingComment = comments.find(
              comment => comment.user.type === "Bot" &&
                         comment.body.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }